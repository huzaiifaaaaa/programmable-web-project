services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probotapi_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
    volumes:
      # Named volume mounted at /app so the SQLite DB (created at
      # /app/pro_bot_prod.db by the app) survives container restarts.
      # Docker initialises the volume from the image contents on first run.
      - app_data:/data
      - app_logs:/var/log
    expose:
      - "8000"
    networks:
      - probot_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: probotapi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - probot_net

volumes:
  app_data:
  app_logs:
  nginx_logs:

networks:
  probot_net:
    driver: bridge
