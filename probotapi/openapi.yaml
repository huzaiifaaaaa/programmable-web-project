openapi: 3.0.3
info:
  title: ProBot API
  version: v1
  description: >
    ProBot is a REST API for an AI chat assistant powered by Google Gemini.
    It supports user registration, JWT-based authentication, and persistent
    AI-driven chat sessions.

    All request and response bodies use `application/json`.
    Protected endpoints require `Authorization: Bearer <token>`.

servers:
  - url: /
    description: Application root

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256-signed JWT obtained from POST /api/v1/auth/login.
        Token claims: user_key (UUID), user_id (integer), role_id (integer),
        iat (issued-at timestamp), exp (expiry timestamp, default 3600 s).

  parameters:
    UserKey:
      name: user_key
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    ChatKey:
      name: chat_key
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        example: '"a3f1e9bc4d7e2a1b5c8d0e3f6a9b2c4d"'

  schemas:

    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          format: email
          example: "jane@example.com"
        password:
          type: string
          format: password
          example: "s3cur3P@ss"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "jane@example.com"
        password:
          type: string
          format: password
          example: "s3cur3P@ss"

    UpdateUserRequest:
      type: object
      description: >
        All fields are optional. Only supplied fields are updated.
        Password must be at least 6 characters. The user_role field cannot
        be changed via this endpoint.
      properties:
        name:
          type: string
          example: "Jane Smith"
        email:
          type: string
          format: email
          example: "jane.smith@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "newP@ssw0rd"

    SendMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: >
            The user prompt sent to the LLM. Truncated to 150 words
            before being forwarded to the model.
          example: "What is the capital of Finland?"
        model_key:
          type: string
          description: >
            Gemini model identifier. Defaults to the server-configured model
            (gemini-3-flash-preview). The prefix models/ is added automatically
            if absent.
          example: "gemini-3-flash-preview"

    Link:
      type: object
      properties:
        rel:
          type: string
          example: "self"
        href:
          type: string
          example: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    UserOut:
      type: object
      properties:
        user_id:
          type: integer
          nullable: true
          example: 1
        user_key:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_role:
          type: integer
          nullable: true
          description: Foreign key to the user_role table.
          example: 1
        role_name:
          type: string
          nullable: true
          example: "user"
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          format: email
          example: "jane@example.com"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-06T12:00:00+00:00"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          example:
            - rel: "self"
              href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            - rel: "chats"
              href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890/chats"

    ChatOut:
      type: object
      properties:
        chat_id:
          type: integer
          example: 7
        chat_key:
          type: string
          format: uuid
          example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
        user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-06T13:00:00+00:00"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-06T13:05:00+00:00"

    ConversationOut:
      type: object
      properties:
        conversation_id:
          type: integer
          example: 42
        conversation_key:
          type: string
          format: uuid
          example: "11223344-5566-7788-99aa-bbccddeeff00"
        chat_id:
          type: integer
          example: 7
        model_id:
          type: integer
          example: 1
        model_key:
          type: string
          nullable: true
          example: "gemini-3-flash-preview"
        request:
          type: string
          description: The user message as stored, capped at 150 words.
          example: "What is the capital of Finland?"
        response:
          type: string
          description: The LLM reply, capped at 150 words.
          example: "The capital of Finland is Helsinki."
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-06T13:05:10+00:00"

    SignupSuccess:
      type: object
      properties:
        status:
          type: string
          example: "created"
        user:
          $ref: '#/components/schemas/UserOut'

    LoginSuccess:
      type: object
      properties:
        token:
          type: string
          description: Bearer JWT to use in the Authorization header of subsequent requests.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2tleSI6ImExYjJjM2Q0LWU1ZjYtNzg5MC1hYmNkLWVmMTIzNDU2Nzg5MCIsInVzZXJfaWQiOjEsInJvbGVfaWQiOjEsImlhdCI6MTc0Mzk0MDAwMCwiZXhwIjoxNzQzOTQzNjAwfQ.signature"
        user:
          $ref: '#/components/schemas/UserOut'

    UpdateUserSuccess:
      type: object
      properties:
        status:
          type: string
          example: "updated"
        user:
          $ref: '#/components/schemas/UserOut'

    CreateChatSuccess:
      type: object
      properties:
        status:
          type: string
          example: "created"
        chat:
          $ref: '#/components/schemas/ChatOut'

    ListChatsSuccess:
      type: object
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/ChatOut'
        count:
          type: integer
          example: 2

    SendMessageSuccess:
      type: object
      properties:
        status:
          type: string
          example: "message_sent"
        conversation:
          $ref: '#/components/schemas/ConversationOut'

    GetMessagesSuccess:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/ChatOut'
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationOut'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationOut'

    DeletedStatus:
      type: object
      properties:
        status:
          type: string
          example: "deleted"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "descriptive error message"

  responses:

    Unauthorized:
      description: Missing, expired, or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_token:
              summary: No Authorization header supplied
              value:
                error: "Missing Bearer token"
            expired_token:
              summary: JWT has expired
              value:
                error: "Token expired"
            invalid_token:
              summary: JWT signature or format is invalid
              value:
                error: "Invalid token"

    Forbidden:
      description: Authenticated user does not own the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "forbidden"

    UserNotFound:
      description: User not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "user not found"

    ChatNotFound:
      description: Chat not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "chat not found"

paths:

  /:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns API status and runtime environment details.
      operationId: healthCheck
      responses:
        '200':
          description: API is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  environment:
                    type: string
                  database:
                    type: string
              example:
                message: "ProBot API is running!"
                environment: "stage"
                database: "sqlite:///pro_bot_stage.db"

  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user account
      description: >
        Creates a new user with the default role user.
        The email is lowercased and stripped before storage.
        The password is hashed server-side using PBKDF2 (werkzeug).
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: "Jane Doe"
              email: "jane@example.com"
              password: "s3cur3P@ss"
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupSuccess'
              example:
                status: "created"
                user:
                  user_id: 1
                  user_key: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_role: 1
                  role_name: "user"
                  name: "Jane Doe"
                  email: "jane@example.com"
                  is_active: true
                  created_at: "2026-04-06T12:00:00+00:00"
                  links:
                    - rel: "self"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    - rel: "chats"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890/chats"
        '400':
          description: One or more required fields are missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "name, email, password are required"
        '409':
          description: The email address is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "email already exists"
        '500':
          description: Server misconfiguration — the default user role has not been seeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "default role 'user' not found, seed roles first"

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate and obtain a JWT
      description: >
        Validates credentials and returns a signed HS256 JWT.
        Pass the token as Authorization: Bearer <token> on subsequent requests.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "jane@example.com"
              password: "s3cur3P@ss"
      responses:
        '200':
          description: Login successful. Returns JWT and user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2tleSI6ImExYjJjM2Q0LWU1ZjYtNzg5MC1hYmNkLWVmMTIzNDU2Nzg5MCIsInVzZXJfaWQiOjEsInJvbGVfaWQiOjEsImlhdCI6MTc0Mzk0MDAwMCwiZXhwIjoxNzQzOTQzNjAwfQ.signature"
                user:
                  user_id: 1
                  user_key: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_role: 1
                  role_name: "user"
                  name: "Jane Doe"
                  email: "jane@example.com"
                  is_active: true
                  created_at: "2026-04-06T12:00:00+00:00"
                  links:
                    - rel: "self"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    - rel: "chats"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890/chats"
        '400':
          description: Missing email or password in the request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "email and password are required"
        '401':
          description: Email not found or password does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "invalid credentials"
        '403':
          description: Account exists but has been deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "user is inactive"

  /api/v1/users/{user_key}:
    parameters:
      - $ref: '#/components/parameters/UserKey'

    get:
      tags:
        - Users
      summary: Get user profile
      description: >
        Returns the authenticated user's profile. A user can only retrieve
        their own profile (user_key in the path must match the JWT).

        Supports conditional GET: send If-None-Match with the ETag value from
        a prior response. A matching ETag yields 304 Not Modified with no body.
        Responses carry ETag (SHA-256 of user data) and Cache-Control: private,
        max-age=60 headers. The server also caches the payload for 60 seconds.
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: User profile returned.
          headers:
            ETag:
              description: SHA-256 fingerprint of the current user data.
              schema:
                type: string
                example: '"a3f1e9bc4d7e2a1b5c8d0e3f6a9b2c4d"'
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=60"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
              examples:
                active_user:
                  summary: Profile of an active user
                  value:
                    user_id: 1
                    user_key: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    user_role: 1
                    role_name: "user"
                    name: "Jane Doe"
                    email: "jane@example.com"
                    is_active: true
                    created_at: "2026-04-06T12:00:00+00:00"
                    links:
                      - rel: "self"
                        href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      - rel: "chats"
                        href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890/chats"
                inactive_user:
                  summary: Profile of a deactivated user
                  value:
                    user_id: 2
                    user_key: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                    user_role: 1
                    role_name: "user"
                    name: "Bob Inactive"
                    email: "bob@example.com"
                    is_active: false
                    created_at: "2026-01-15T09:30:00+00:00"
                    links:
                      - rel: "self"
                        href: "/api/v1/users/b2c3d4e5-f6a7-8901-bcde-f01234567891"
                      - rel: "chats"
                        href: "/api/v1/users/b2c3d4e5-f6a7-8901-bcde-f01234567891/chats"
        '304':
          description: >
            Not Modified. The If-None-Match value matched the current ETag.
            No response body is returned; the client should use its cached copy.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

    put:
      tags:
        - Users
      summary: Update user profile
      description: >
        Updates one or more fields of the authenticated user's profile.
        All body fields are optional; only supplied fields are modified.
        Attempting to set user_role returns 403.
        Sending an empty or unparseable body returns 400.
        A user can only update their own profile.
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              update_name:
                summary: Rename the account
                value:
                  name: "Jane Smith"
              update_email:
                summary: Change email address
                value:
                  email: "jane.smith@example.com"
              update_password:
                summary: Change password
                value:
                  password: "newP@ssw0rd"
              update_all:
                summary: Update all fields simultaneously
                value:
                  name: "Jane Smith"
                  email: "jane.smith@example.com"
                  password: "newP@ssw0rd"
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserSuccess'
              example:
                status: "updated"
                user:
                  user_id: 1
                  user_key: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_role: 1
                  role_name: "user"
                  name: "Jane Smith"
                  email: "jane.smith@example.com"
                  is_active: true
                  created_at: "2026-04-06T12:00:00+00:00"
                  links:
                    - rel: "self"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    - rel: "chats"
                      href: "/api/v1/users/a1b2c3d4-e5f6-7890-abcd-ef1234567890/chats"
        '400':
          description: Invalid or missing field value in the request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_body:
                  summary: Request body is absent or cannot be parsed
                  value:
                    error: "Invalid request or role modification"
                empty_name:
                  summary: name field is blank
                  value:
                    error: "name cannot be empty"
                empty_email:
                  summary: email field is blank
                  value:
                    error: "email cannot be empty"
                short_password:
                  summary: password is fewer than 6 characters
                  value:
                    error: "password too short (>=6)"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — wrong user or attempted role change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrong_user:
                  summary: JWT user_key does not match path user_key
                  value:
                    error: "forbidden"
                role_change_attempt:
                  summary: Request body contains user_role
                  value:
                    error: "User role cannot be modified"
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: The new email address is already taken by another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "email already exists"

    delete:
      tags:
        - Users
      summary: Delete user account
      description: >
        Permanently removes the authenticated user's account together with all
        associated chat sessions and conversation history.
        A user can only delete their own account.
      operationId: deleteUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedStatus'
              example:
                status: "deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/v1/chats:
    post:
      tags:
        - Chats
      summary: Create a new chat session
      description: >
        Creates an empty chat session owned by the authenticated user.
        No request body is required.
        Use POST /api/v1/chats/{chat_key}/conversations to send the first message.
      operationId: createChat
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Chat session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatSuccess'
              example:
                status: "created"
                chat:
                  chat_id: 7
                  chat_key: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                  user_id: 1
                  created_at: "2026-04-06T13:00:00+00:00"
                  updated_at: "2026-04-06T13:00:00+00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user referenced by the JWT no longer exists in the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "user not found"
        '500':
          description: Database error while persisting the new chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "failed to create chat"

  /api/v1/users/{user_key}/chats:
    parameters:
      - $ref: '#/components/parameters/UserKey'

    get:
      tags:
        - Chats
      summary: List all chats for a user
      description: >
        Returns every chat session belonging to the specified user, ordered
        by updated_at descending (most recently active first).
        A user can only list their own chats.
      operationId: listChats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of chat sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatsSuccess'
              examples:
                multiple_chats:
                  summary: User with two active chat sessions
                  value:
                    chats:
                      - chat_id: 7
                        chat_key: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                        user_id: 1
                        created_at: "2026-04-06T13:00:00+00:00"
                        updated_at: "2026-04-06T13:05:00+00:00"
                      - chat_id: 3
                        chat_key: "aabbccdd-eeff-0011-2233-445566778899"
                        user_id: 1
                        created_at: "2026-04-05T09:00:00+00:00"
                        updated_at: "2026-04-05T09:20:00+00:00"
                    count: 2
                no_chats:
                  summary: User with no chat sessions yet
                  value:
                    chats: []
                    count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/v1/chats/{chat_key}:
    parameters:
      - $ref: '#/components/parameters/ChatKey'

    delete:
      tags:
        - Chats
      summary: Delete a chat session
      description: >
        Permanently deletes the chat session and all its conversation records.
        Only the owner of the chat may delete it.
      operationId: deleteChat
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Chat deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedStatus'
              example:
                status: "deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '500':
          description: Database error while deleting the chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "failed to delete chat"

  /api/v1/chats/{chat_key}/conversations:
    parameters:
      - $ref: '#/components/parameters/ChatKey'

    post:
      tags:
        - Messages
      summary: Send a message and receive an AI reply
      description: >
        Sends the user's message to the Gemini LLM and stores both the
        request and the response as a Conversation record linked to the chat.

        The message is truncated to 150 words before being forwarded.
        The LLM response is also capped at 150 words.
        The chat's updated_at timestamp is refreshed on every successful call.

        Only the owner of the chat may post messages to it.
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              default_model:
                summary: Simple question using the server default model
                value:
                  message: "What is the capital of Finland?"
              explicit_model:
                summary: Same question specifying the model key explicitly
                value:
                  message: "What is the capital of Finland?"
                  model_key: "gemini-3-flash-preview"
      responses:
        '201':
          description: Message sent and AI response received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageSuccess'
              example:
                status: "message_sent"
                conversation:
                  conversation_id: 42
                  conversation_key: "11223344-5566-7788-99aa-bbccddeeff00"
                  chat_id: 7
                  model_id: 1
                  model_key: "gemini-3-flash-preview"
                  request: "What is the capital of Finland?"
                  response: "The capital of Finland is Helsinki."
                  created_at: "2026-04-06T13:05:10+00:00"
        '400':
          description: The message field is absent or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "message is required"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Chat not found or the requested model is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                chat_not_found:
                  summary: chat_key does not match any chat
                  value:
                    error: "chat not found"
                model_not_found:
                  summary: Requested model key is not registered or inactive
                  value:
                    error: "model 'gemini-3-flash-preview' not found"
        '500':
          description: Database error while saving the conversation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "failed to save conversation"
        '502':
          description: The upstream Gemini API returned an error or is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                api_client_error:
                  summary: Gemini API returned a client-level error (e.g. quota exceeded)
                  value:
                    error: "llm_error: API Client Error: 429 Resource has been exhausted"
                api_key_missing:
                  summary: GEMINI_API_KEY is not set on the server
                  value:
                    error: "llm_error: Gemini API key not configured"

    get:
      tags:
        - Messages
      summary: Get full conversation history for a chat
      description: >
        Returns all messages in the chat in chronological order
        (oldest conversation first).
        Only the owner of the chat may retrieve its messages.
      operationId: getConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversation history returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessagesSuccess'
              examples:
                with_messages:
                  summary: Chat with two message exchanges
                  value:
                    chat:
                      chat_id: 7
                      chat_key: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                      user_id: 1
                      created_at: "2026-04-06T13:00:00+00:00"
                      updated_at: "2026-04-06T13:10:00+00:00"
                    conversations:
                      - conversation_id: 42
                        conversation_key: "11223344-5566-7788-99aa-bbccddeeff00"
                        chat_id: 7
                        model_id: 1
                        model_key: "gemini-3-flash-preview"
                        request: "What is the capital of Finland?"
                        response: "The capital of Finland is Helsinki."
                        created_at: "2026-04-06T13:05:10+00:00"
                      - conversation_id: 43
                        conversation_key: "aabbccdd-1122-3344-5566-778899001122"
                        chat_id: 7
                        model_id: 1
                        model_key: "gemini-3-flash-preview"
                        request: "What is the population of Helsinki?"
                        response: "Helsinki has a population of approximately 650,000 people in the city proper."
                        created_at: "2026-04-06T13:10:05+00:00"
                    messages:
                      - conversation_id: 42
                        conversation_key: "11223344-5566-7788-99aa-bbccddeeff00"
                        chat_id: 7
                        model_id: 1
                        model_key: "gemini-3-flash-preview"
                        request: "What is the capital of Finland?"
                        response: "The capital of Finland is Helsinki."
                        created_at: "2026-04-06T13:05:10+00:00"
                      - conversation_id: 43
                        conversation_key: "aabbccdd-1122-3344-5566-778899001122"
                        chat_id: 7
                        model_id: 1
                        model_key: "gemini-3-flash-preview"
                        request: "What is the population of Helsinki?"
                        response: "Helsinki has a population of approximately 650,000 people in the city proper."
                        created_at: "2026-04-06T13:10:05+00:00"
                empty_chat:
                  summary: Chat that exists but has no messages yet
                  value:
                    chat:
                      chat_id: 8
                      chat_key: "99887766-5544-3322-1100-ffeeddccbbaa"
                      user_id: 1
                      created_at: "2026-04-06T14:00:00+00:00"
                      updated_at: "2026-04-06T14:00:00+00:00"
                    conversations: []
                    messages: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChatNotFound'

